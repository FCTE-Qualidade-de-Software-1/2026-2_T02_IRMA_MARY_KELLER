<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 620" role="img" aria-labelledby="title desc">
<title id="title">Hierarquia GQM da Khan Academy</title>
<desc id="desc">G1 corresponde a Q1 e Q2; G2 a Q3; G3 a Q4 e Q5. Cada questão liga-se à respectiva família de métricas.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1760" height="620" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172554">
<text x="30" y="35" font-size="24" font-weight="bold">Nível conceitual — Objetivos</text>
<text x="30" y="225" font-size="24" font-weight="bold">Nível operacional — Questões e hipóteses</text>
<text x="30" y="425" font-size="24" font-weight="bold">Nível quantitativo — Métricas</text>
<path d="M400,155 L235,265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M400,155 L565,265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M895,155 L895,265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
