<path d="M1390,155 L1555,265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M235,355 L235,465" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M565,355 L565,465" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M895,355 L895,465" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M1225,355 L1225,465" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<path d="M1555,355 L1555,465" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="185.0" y="65" width="430" height="90" rx="10" fill="#dbeafe" stroke="#334155"/>
<text x="400" y="95" text-anchor="middle" font-size="20">G1</text>
<text x="400" y="120" text-anchor="middle" font-size="20">Eficiência de desempenho</text>
<rect x="680.0" y="65" width="430" height="90" rx="10" fill="#dbeafe" stroke="#334155"/>
<text x="895" y="95" text-anchor="middle" font-size="20">G2</text>
<text x="895" y="120" text-anchor="middle" font-size="20">Portabilidade</text>
